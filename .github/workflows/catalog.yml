name: Dataset catalog checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_catalog.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
